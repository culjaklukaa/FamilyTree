name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        
    - name: Install Linux Qt dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxkbcommon-x11-0 libegl1-mesa xvfb
        
    - name: Install Poetry
      run: pip install poetry
        
    - name: Install dependencies
      run: poetry install
      
    - name: Run tests (Linux)
      if: runner.os == 'Linux'
      run: xvfb-run poetry run pytest
      
    - name: Run tests (Windows)
      if: runner.os == 'Windows'
      run: poetry run pytest
