[tool.poetry]
name = "family-tree-app"
version = "0.1.0"
description = "A local family tree application"
authors = ["User <user@example.com>"]
readme = "README.md"
packages = [{include = "family_tree_app", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10, <3.15"
PySide6 = "^6.0.0"
networkx = "<3.4"
igraph = "^1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-qt = "^4.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
